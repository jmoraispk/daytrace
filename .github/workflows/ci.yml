name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -v
      - run: uv build --no-sources

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/daytrace-core/package-lock.json
      - run: npm ci
        working-directory: packages/daytrace-core
      - run: npm test
        working-directory: packages/daytrace-core
      - run: npm run typecheck
        working-directory: packages/daytrace-core
      - run: npm run build
        working-directory: packages/daytrace-core
      - run: npm run smoke:browser
        working-directory: packages/daytrace-core
